name: Build Bioacoustics Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libqt6svg6 libgl1 libegl1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --name "BioacousticsAnalyzer" --windowed --onedir --hidden-import sklearn --hidden-import librosa --hidden-import tensorflow --collect-all sklearn --collect-all librosa --collect-all scipy --add-data "gui/styles/main_styles.qss:gui/styles" main.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BioacousticsAnalyzer-${{ matrix.os }}
        path: dist/BioacousticsAnalyzer